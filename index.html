<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pushup Analyzer</title>
    <style>
      body { font-family: system-ui, Arial; margin: 0; background: #0b0b0f; color: #fff; }
      header { padding: 26px 18px 10px; max-width: 1100px; margin: 0 auto; }
      .wrap { max-width: 1100px; margin: 0 auto; padding: 0 18px 30px; }
      .card { background: #151521; border: 1px solid #2a2a3a; border-radius: 16px; padding: 16px; }
      .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
      button {
        background: #2d6cff; color: white; border: 0; padding: 10px 14px;
        border-radius: 12px; cursor: pointer; font-weight: 600;
      }
      button:disabled { opacity: 0.6; cursor: not-allowed; }
      input[type="file"] { color: #cfd3ff; }
      .muted { opacity: 0.8; font-size: 14px; }
      .err { color: #ffb4b4; margin-top: 10px; white-space: pre-wrap; }
      .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 14px; }
      .box { background: #10101a; border: 1px solid #2a2a3a; border-radius: 14px; padding: 14px; }
      .big { font-size: 40px; font-weight: 800; margin: 6px 0; }
      .label { opacity: 0.7; font-size: 13px; }
      video { width: 100%; border-radius: 14px; border: 1px solid #2a2a3a; margin-top: 12px; background: #000; }
      pre { white-space: pre-wrap; word-break: break-word; margin: 0; }
      a { color: #8ab4ff; }
      @media (max-width: 850px) { .grid { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <header>
      <h1 style="margin:0 0 8px 0;">Pushup Analyzer V7</h1>
      <div class="muted">Custom UI on GitHub Pages. Backend runs on your HF Space.</div>
    </header>

    <div class="wrap">
      <div class="card">
        <div class="row">
          <input id="file" type="file" accept="video/*" />
          <button id="go">Analyze</button>
          <div id="status" class="muted"></div>
        </div>

        <div id="error" class="err"></div>

        <div class="grid">
          <div class="box">
            <div class="label">Rep Count</div>
            <div id="repCount" class="big">—</div>
          </div>
          <div class="box">
            <div class="label">Avg Rep Confidence</div>
            <div id="avgProb" class="big">—</div>
          </div>
        </div>

        <video id="annotated" controls style="display:none;"></video>

        <div class="box" style="margin-top:14px;">
          <div class="label">Raw JSON</div>
          <pre id="raw">—</pre>
        </div>

        <div class="muted" style="margin-top:10px;">
          If something breaks, open the backend directly:
          <a id="spaceLink" href="#" target="_blank" rel="noreferrer">HF Space</a>
        </div>
      </div>
    </div>

    <script type="module">
  import { Client } from "https://cdn.jsdelivr.net/npm/@gradio/client/dist/index.min.js";

  // Put your real HuggingFace username + space name:
  const SPACE_ID = "YOUR_USERNAME/YOUR_SPACE_NAME";
  const SPACE_URL = `https://${SPACE_ID.replace("/", "-")}.hf.space`;

  document.getElementById("spaceLink").href = SPACE_URL;

  const fileEl = document.getElementById("file");
  const goEl = document.getElementById("go");
  const statusEl = document.getElementById("status");
  const errorEl = document.getElementById("error");
  const repCountEl = document.getElementById("repCount");
  const avgProbEl = document.getElementById("avgProb");
  const rawEl = document.getElementById("raw");
  const vidEl = document.getElementById("annotated");

  function setError(msg) { errorEl.textContent = msg || ""; }
  function setStatus(msg) { statusEl.textContent = msg || ""; }

  goEl.addEventListener("click", async () => {
    setError("");
    setStatus("");

    const file = fileEl.files?.[0];
    if (!file) { setError("Pick a video first."); return; }

    goEl.disabled = true;
    setStatus("Connecting to backend...");

    try {
      // Connect by Space ID (recommended) OR by URL.
      const client = await Client.connect(SPACE_ID);

      setStatus("Uploading + analyzing...");

      // IMPORTANT: for a single input, pass an array
      const result = await client.predict("/analyze", [file]);

      const [json, annotated] = result.data || [];

      rawEl.textContent = JSON.stringify(json, null, 2);

      if (!json?.ok) {
        setError("Backend error: " + (json?.error || "unknown"));
        repCountEl.textContent = "—";
        avgProbEl.textContent = "—";
        vidEl.style.display = "none";
        return;
      }

      repCountEl.textContent = json.rep_count ?? 0;
      avgProbEl.textContent = Number(json.avg_rep_prob ?? 0).toFixed(2);

      if (typeof annotated === "string" && annotated.startsWith("http")) {
        vidEl.src = annotated;
        vidEl.style.display = "block";
      } else {
        vidEl.style.display = "none";
      }

      setStatus("Done.");
    } catch (e) {
      // This is why you saw [object Object]
      setError(e?.message ? `${e.message}\n${JSON.stringify(e, null, 2)}` : String(e));
    } finally {
      goEl.disabled = false;
    }
  });
</script>

  </body>
</html>
