<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pushup Prototype</title>
    <style>
      body { font-family: system-ui, Arial; margin: 0; background: #0b0b0f; color: #fff; }
      header { padding: 24px 18px; max-width: 1100px; margin: 0 auto; }
      .card { background: #151521; border: 1px solid #2a2a3a; border-radius: 16px; padding: 16px; }
      .wrap { max-width: 1100px; margin: 0 auto; padding: 0 18px 30px; }
      iframe { width: 100%; height: 820px; border: 0; border-radius: 16px; overflow: hidden; }
      a { color: #8ab4ff; }
    </style>
  </head>
  <body>
    <header>
      <h1 style="margin:0 0 8px 0;">Pushup Prototype</h1>
      <div style="opacity:0.85;">Upload a video, get rep count + per-rep probability.</div>
    </header>

    <div class="wrap">
      <div class="card">
        <iframe
          src="https://YOUR-SPACE-URL-HERE"
          allow="camera; microphone; clipboard-read; clipboard-write"
        ></iframe>
        <div style="margin-top:10px; opacity:0.8; font-size:14px;">
          If the embed fails, open it directly:
          <a href="https://gibil-pushup-prototype.hf.space" target="_blank" rel="noreferrer">Launch the app</a>
        </div>
      </div>
    </div>
  </body>
</html>
